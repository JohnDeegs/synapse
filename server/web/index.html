<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>Synapse</title>
  <link rel="manifest" href="/web/manifest.webmanifest">
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>

  <!-- ── Login View ── -->
  <div id="view-login" class="hidden">
    <div class="login-box">
      <h1 class="login-brand">Synapse</h1>

      <div id="auth-tabs">
        <button class="tab-btn active" data-tab="login">Sign in</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="form-login">
        <label class="field-label">Email
          <input type="email" id="login-email" autocomplete="email" required>
        </label>
        <label class="field-label">Password
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <div id="login-error" class="error-msg"></div>
        <button type="submit" class="btn-primary btn-full">Sign in</button>
      </form>

      <form id="form-register" class="hidden">
        <label class="field-label">Email
          <input type="email" id="reg-email" autocomplete="email" required>
        </label>
        <label class="field-label">Password
          <input type="password" id="reg-password" autocomplete="new-password" minlength="8" required>
        </label>
        <div id="reg-error" class="error-msg"></div>
        <button type="submit" class="btn-primary btn-full">Create account</button>
      </form>
    </div>
  </div>

  <!-- ── App View ── -->
  <div id="view-app" class="hidden">

    <header class="app-header">
      <button id="btn-drawer" class="btn-header btn-drawer" aria-label="Folders">☰</button>
      <a href="#/" class="brand-name">Synapse</a>
      <input type="search" id="search" class="search-input" placeholder="Search titles, notes, tags, links…" autocomplete="off">
      <div class="header-right">
        <a href="#/review" class="btn-header">Review</a>
        <button id="btn-theme" class="btn-header" title="Toggle dark mode">🌙</button>
        <button id="btn-logout" class="btn-header">Sign out</button>
      </div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar">
        <nav id="tree" class="tree" aria-label="Folders"></nav>
        <h3 class="sidebar-heading">Tags</h3>
        <div id="tag-list" class="tag-list"></div>
      </aside>
      <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

      <main id="main" class="main-content"></main>
    </div>
  </div>

  <!-- ── Item editor ── -->
  <dialog id="editor" class="editor">
    <form id="editor-form" method="dialog">
      <h2 id="editor-heading" class="editor-heading">New link</h2>

      <label class="field-label" id="editor-url-wrap">Link or file path
        <input type="text" id="editor-url" placeholder="https://… or C:\path\to\file" autocomplete="off">
      </label>
      <label class="field-label">Title
        <input type="text" id="editor-title" maxlength="300" autocomplete="off">
      </label>
      <label class="field-label">Why this matters
        <textarea id="editor-note" rows="3" maxlength="2000" placeholder="What is this for? Who needs it? What's next?"></textarea>
      </label>
      <label class="field-label">Folder
        <select id="editor-parent"></select>
      </label>
      <div class="field-row">
        <label class="field-label">Priority
          <select id="editor-priority">
            <option value="">None</option>
            <option value="P0">P0 – Critical</option>
            <option value="P1">P1 – High</option>
            <option value="P2">P2 – Medium</option>
            <option value="P3">P3 – Low</option>
            <option value="P4">P4 – Someday</option>
          </select>
        </label>
        <label class="field-label">Deadline
          <input type="date" id="editor-due">
        </label>
      </div>
      <label class="field-label">Tags <span class="field-hint">comma-separated</span>
        <input type="text" id="editor-tags" list="tag-options" autocomplete="off">
      </label>
      <datalist id="tag-options"></datalist>

      <div id="editor-error" class="error-msg"></div>
      <div class="editor-actions">
        <button type="button" id="editor-delete" class="btn-danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel" class="btn-text">Cancel</button>
        <button type="submit" id="editor-save" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/web/app.js"></script>
</body>
</html>
