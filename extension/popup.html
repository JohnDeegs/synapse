<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synapse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="view-signed-out" class="view hidden">
    <p>Sign in to start filing tabs.</p>
    <button id="btn-options" class="btn-primary">Open settings</button>
  </div>

  <div id="view-loading" class="view">
    <p class="muted">Loading…</p>
  </div>

  <!-- Already filed -->
  <div id="view-filed" class="view hidden">
    <div class="filed-head">✓ Already filed in</div>
    <div id="filed-path" class="path"></div>
    <div id="filed-title" class="title"></div>
    <div id="filed-note" class="note"></div>
    <div class="actions">
      <a id="filed-open" class="btn-secondary" target="_blank">Open folder</a>
    </div>
  </div>

  <!-- File this tab -->
  <form id="view-file" class="view hidden" autocomplete="off">
    <input id="title" class="title-input" maxlength="300" aria-label="Title">
    <div id="url" class="url muted"></div>

    <label class="label" for="folder-search">Folder</label>
    <div class="picker">
      <input id="folder-search" placeholder="Type to find a folder…" aria-label="Find folder">
      <div id="folder-list" class="folder-list" role="listbox"></div>
    </div>

    <label class="label" for="note">Why this matters</label>
    <textarea id="note" rows="2" maxlength="2000" placeholder="What is it for? (Enter to save, Shift+Enter for a new line)"></textarea>
    <div id="tag-hints" class="tag-hints"></div>

    <details id="more">
      <summary>Priority, deadline, tags</summary>
      <div class="row">
        <select id="priority" aria-label="Priority">
          <option value="">No priority</option>
          <option value="P0">P0 – Critical</option>
          <option value="P1">P1 – High</option>
          <option value="P2">P2 – Medium</option>
          <option value="P3">P3 – Low</option>
          <option value="P4">P4 – Someday</option>
        </select>
        <input type="date" id="due" aria-label="Deadline">
      </div>
      <input id="tags" placeholder="Tags, comma-separated" list="tag-options">
      <datalist id="tag-options"></datalist>
    </details>

    <div id="error" class="error"></div>
    <div class="actions">
      <span class="muted small">Enter to save</span>
      <button type="submit" id="btn-save" class="btn-primary">Save</button>
    </div>
  </form>

  <div id="view-done" class="view hidden">
    <div class="filed-head">✓ Filed in</div>
    <div id="done-path" class="path"></div>
  </div>

  <script src="api.js"></script>
  <script src="synapse-ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
